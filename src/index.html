<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <!-- Defaults; each page sets its own title, description, canonical and share tags (SeoService) -->
  <title>Practice Jazz Chords – Jazz chord flashcards in all 12 keys</title>
  <meta name="description"
    content="Free jazz chord trainer in the browser. Play one bar of chords at a time in tempo, in all 12 keys: maj7, m7 and 7 chords, ii–V–I and your own progressions, with extra practice for unfamiliar keys.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#CBEAFB" media="(prefers-color-scheme: light)" data-scheme="light">
  <meta name="theme-color" content="#0D425D" media="(prefers-color-scheme: dark)" data-scheme="dark">
  <script>
    try {
      var root = document.documentElement;
      // A theme chosen in the app wins over the device setting, also for the browser bar color
      // (AppComponent.setTheme does the same when the choice changes)
      var theme = localStorage.getItem('theme');
      if (theme === 'light' || theme === 'dark') {
        root.setAttribute('data-theme', theme);
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
          meta.media = meta.getAttribute('data-scheme') === theme ? 'all' : 'not all';
        });
      }
      // The prerendered player shows the default settings; hide it until the app has applied the
      // stored ones (PlayerComponent), or after a few seconds if the app does not start
      if (localStorage.getItem('tempo') !== null) {
        root.classList.add('restoring-settings');
        setTimeout(function () { root.classList.remove('restoring-settings'); }, 4000);
      }
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body class="mat-typography">
  <app-root></app-root>

  <!-- 100% privacy-first analytics -->
  <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
</body>

</html>
