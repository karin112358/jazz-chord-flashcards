<header class="page-header">
  <h1>Change Log</h1>
  <p class="lede">What changed in Practice Jazz Chords, newest first.</p>
</header>

<ol class="changes">
  @for (change of changeLog; track change.date) {
  <li>
    <time [attr.datetime]="change.date">{{ change.date | date: 'd MMM y' }}</time>
    <p>{{ change.changes }}</p>
  </li>
  }
</ol>
